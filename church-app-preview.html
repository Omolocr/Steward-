:root{--bg:#F6F4EE;--card:#fff;--ink:#1F2A37;--mute:#6B7280;--line:#E5E1D6;--pri:#1F4E79;--soft:#E3EDF7;--gold:#B8862B;--ok:#2E7D4F;--warn:#B45309;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:#d9d6cc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
#wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.2)}
#preview{background:#222;color:#fff;font-size:12px;padding:6px 10px;display:flex;gap:6px;align-items:center}
#preview select{flex:1;font-size:12px;padding:3px;border-radius:6px}
#preview button{font-size:11px;padding:3px 8px;border-radius:6px;border:0;background:#555;color:#fff}
header{background:var(--pri);color:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .b{width:56px;font-size:14px;cursor:pointer;background:none;border:0;color:#fff;text-align:left}
header .b.r{text-align:right}
header .rt{display:flex;gap:8px;align-items:center;justify-content:flex-end}header .x{background:none;border:0;color:#fff;font-size:13px;cursor:pointer;padding:0}
main{padding:14px;flex:1;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.card h3{margin:0 0 6px;font-size:15px}
.mute{color:var(--mute);font-size:12px}
p{margin:4px 0;font-size:14px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;position:relative}
.tile:active{background:var(--soft)}
.tile .i{font-size:26px}.tile .t{font-size:13px;font-weight:600;margin-top:4px}
.dot{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
textarea{min-height:90px}
.btn{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:700;margin-top:10px;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.warn{background:var(--warn)}
.btn.s{display:inline-block;width:auto;padding:6px 12px;font-size:13px;margin:6px 6px 0 0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--pri)}
.badge.ok{background:#e1f2e8;color:var(--ok)}.badge.w{background:#fdebd3;color:var(--warn)}.badge.g{background:#eee;color:#555}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}
.split{display:grid;grid-template-columns:1fr 80px 28px;gap:6px;margin-bottom:6px}
.calc{background:var(--soft);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
.receipt{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:#fffdf5;border:1px dashed var(--gold);border-radius:8px;padding:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;z-index:20;text-align:center}
#toast.on{opacity:1}
.hero{background:linear-gradient(135deg,var(--pri),#2c6aa0);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 2px;font-size:19px}.hero p{color:#dbe8f5;font-size:13px}
.notice{border-left:4px solid var(--gold)}
.sum{display:flex;gap:8px;margin-bottom:10px}.sum .card{flex:1;margin:0;text-align:center}.sum b{font-size:16px}
.lang{display:inline-flex;border:1px solid #fff;border-radius:8px;overflow:hidden}.lang button{background:transparent;color:#fff;border:0;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer}.lang button.on{background:#fff;color:var(--pri)}
#supw{position:fixed;right:14px;bottom:18px;z-index:15}.supfab{width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);font-size:26px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);position:relative}.supn{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;border-radius:11px;font-size:12px;min-width:22px;padding:1px 5px;font-weight:700}
.suppanel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100vw);height:min(78vh,560px);background:#fff;border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25);display:flex;flex-direction:column}.suphd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.suphd button{background:none;border:0;font-size:20px;cursor:pointer}.supmsgs{flex:1;overflow:auto;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}.supm{max-width:82%;align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}.supm.me{align-self:flex-end;background:var(--soft)}.supm small{color:var(--mute);font-size:11px;display:block}.suprow{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}.suprow textarea{min-height:0;flex:1}
@media print{#supw,#preview,header,.noprint,#toast{display:none!important}body{background:#fff}}
#pushbanner{position:fixed;top:8px;left:50%;transform:translate(-50%,-140%);width:min(92vw,420px);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:99;cursor:pointer;transition:transform .25s}#pushbanner.on{transform:translate(-50%,0)}
</style>

function verifyPay(p){

  p.verification=t.amount===p.amount?{state:'verified',mpesaAmount:t.amount,mpesaName:t.name}:{state:'amount_mismatch',mpesaAmount:t.amount,mpesaName:t.name};
}

  return x.state==='verified'?badge('✓ Verified by M-Pesa: '+x.mpesaName,'ok'):x.state==='amount_mismatch'?badge('⚠ M-Pesa shows '+ksh(x.mpesaAmount)+', member said '+ksh(p.amount),'w'):badge('Not on the Pay Bill yet','w')}
function unclaimedCard(){

}

/* ---------- give / payments ---------- */
let G={purpose:'',amount:'',code:'',mname:'',rows:[{c:'Tithe',p:10},{c:'Offering',p:20},{c:'Church Budget',p:70}]};
function split(amount,rows){
  const cl=rows.filter(r=>r.c&&r.p>0);amount=Number(amount);
  if(!(amount>0))return{err:'Enter the amount paid.'};
  const tot=Math.round(cl.reduce((s,r)=>s+Number(r.p),0)*100)/100;
  if(tot!==100)return{err:`Percentages add up to ${tot}%. They must total 100%.`,tot};
  let used=0;const al=cl.map((r,i)=>{const a=i===cl.length-1?Math.round((amount-used)*100)/100:Math.round(amount*r.p)/100;used=Math.round((used+a)*100)/100;return{category:r.c,percent:Number(r.p),amount:a}});
  return{al,tot};
}
function calc(){
  const el=$('calc');if(!el)return;const r=split(G.amount,G.rows);
  const tot=G.rows.reduce((s,x)=>s+Number(x.p||0),0);
  el.innerHTML=r.err?`<span style="color:var(--bad)">${esc(r.err)}</span>`:r.al.map(a=>`<div><span>${esc(a.category)} (${a.percent}%)</span><b>${ksh(a.amount)}</b></div>`).join('')+`<div style="border-top:1px solid #bcd;margin-top:4px;padding-top:4px"><span>Total sent to Treasurer</span><b>${ksh(G.amount)}</b></div>`;
  const t=$('tot');if(t)t.textContent=tot+'% allocated';
}

  const un=unreadAdmin(ch.id);
  return `<div class="hero"><p>Your church</p><h2>${esc(ch.name)}</h2><p style="margin-top:8px">Special church number</p><h2 id="cnum" style="font-size:30px;letter-spacing:3px">${fmtNum(ch.number)}</h2><p>Members enter this number when they sign up or move to your church. It is given by the app developer.</p></div>
  <div class="card"><h3>At a glance</h3>${badge(act.length+' members')} ${wait.length?badge(wait.length+' waiting to join','w'):''} ${rv.length?badge(rv.length+' positions to verify','w'):''} ${badge(arc.length+' archived','g')}</div>
  <button class="btn" onclick="go('adminMembers')">${wait.length?'Members ('+wait.length+' waiting)':'Members'}</button>
  <button class="btn ghost" onclick="go('roles')">${rv.length?'Verify Leader Positions ('+rv.length+')':'Verify Leader Positions'}</button>
  <button class="btn ghost" onclick="go('adminBulk')">Export, import &amp; directory</button>
  <button class="btn ghost" onclick="go('adminSettings')">Church settings (Pay Bill, giving categories)</button>
  <button class="btn ghost" onclick="go('activities',{g:'church'})">Church calendar &amp; activities</button>
  <button class="btn ghost" onclick="go('churchboard')">Church Notice Board</button>
  <button class="btn ghost" onclick="go('archive')">Archive &amp; Audit</button>
  <button class="btn ok" onclick="A.supOpen()">${un?'Talk to the app developer ('+un+' new)':'Talk to the app developer'}</button>
  <p class="mute" style="text-align:center;margin-top:10px">Nothing is ever deleted: removing a member or an activity archives it, and it can be restored.</p>`;

SCREENS.adminMembers=()=>{
  const u=me();if(!isCA(u))return empty('Only the Church Admin can open this page.');
  const active=S.users.filter(x=>!x.archived&&x.join!=='pending'),waiting=S.users.filter(x=>!x.archived&&x.join==='pending'),archived=S.users.filter(x=>x.archived);
  const shown=AM.tab==='Active'?active:AM.tab==='Waiting'?waiting:archived;
  const tab=(k,n)=>`<span class="chip ${AM.tab===k?'on':''}" onclick="AM.tab='${k}';render()">${k==='Active'?'Active ('+n+')':k==='Waiting'?'Waiting to join ('+n+')':'Archived ('+n+')'}</span>`;
  const add=AM.showAdd?`<div class="card"><h3>Add a member</h3><p class="mute">They sign in later with this phone number. They do not need a church number because they are already linked to your church.</p>
   <label>Full name</label><input id="am_name"><label>Phone number</label><input id="am_phone" inputmode="tel" placeholder="07XXXXXXXX"><label>ID number (optional)</label><input id="am_id" inputmode="numeric">
   <label>Position</label><select id="am_role">${roleOptions('member')}</select><label>Groups</label><div class="chips">${GROUPS.map(g=>`<span class="chip ${AM.groups.includes(g[0])?'on':''}" onclick="A.amGroup('${g[0]}')">${esc(g[1])}</span>`).join('')}</div>
   <button class="btn" id="am_add" onclick="A.adminAdd()">Add member</button></div>`:'';
  return `<div class="chips">${tab('Active',active.length)}${tab('Waiting',waiting.length)}${tab('Archived',archived.length)}</div>
  <button class="btn ghost" id="am_toggle" onclick="AM.showAdd=!AM.showAdd;render()">${AM.showAdd?'Close':'+ Add a member'}</button>${add}
  ${shown.length?shown.map(m=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(m.name)}</h3>${badge(rl(m.role),m.role==='member'?'g':'')}</div><p class="mute">${esc(m.phone)}${m.groups.length?' · '+m.groups.map(gl).join(', '):''}</p>
   ${m.roleStatus==='pending'?`<p>Asked for: ${esc(rl(m.requested))} (not yet verified)</p>`:''}
   ${AM.tab==='Waiting'?`<button class="btn ok s" onclick="A.adminJoin('${m.id}',true)">Let in</button><button class="btn ghost s" onclick="A.adminJoin('${m.id}',false)">Decline</button>`:''}
   ${AM.tab==='Active'&&m.id!==u.id?(AM.editing===m.id?`<select id="am_er">${roleOptions(m.role)}</select><button class="btn s" onclick="A.adminSetRole('${m.id}')">Save position</button><button class="btn ghost s" onclick="AM.editing=null;render()">Cancel</button>`:`<button class="btn ghost s" onclick="AM.editing='${m.id}';render()">Change position</button><button class="btn warn s" onclick="A.adminArchive('${m.id}')">Archive</button>`):''}
   ${AM.tab==='Archived'?`<button class="btn ghost s" onclick="A.adminRestore('${m.id}')">Restore</button>`:''}</div>`).join(''):empty(AM.tab==='Waiting'?'Nobody is waiting to join.':AM.tab==='Archived'?'No archived members.':'No members yet.')}`;
};

/* ----- the support chat widget (Church Admin only) ----- */
let SP={open:false};

/* ----- the App Developer console (up to 10 developers) ----- */
const MAX_DEVS=10;
let DV={tab:'Churches',step:'phone',phone:'',code:null,thread:null,made:null};
const devNow=()=>R.devs.find(d=>d.id===R.dev);
const activeDevs=()=>R.devs.filter(d=>d.status==='active').length;
SCREENS.devlogin=()=>DV.step==='phone'?`<div class="card"><h3>App developer console</h3><p class="mute">Only phone numbers on the app developer team can open this console. Preview: use <b>0700000001</b>; the code appears in the 📱 SMS simulator.</p></div><label>Phone number</label><input id="dv_phone" inputmode="tel" value="${esc(DV.phone)}"><button class="btn" id="dv_go" onclick="A.devSend()">Send me a code</button><button class="btn ghost" onclick="nav=[{s:'signup'}];render()">Back to the church app</button>`
 :`<div class="card"><p class="mute">We sent a code to ${esc(DV.phone)}. Open the 📱 SMS simulator.</p></div><label>6-digit code</label><input id="dv_code" inputmode="numeric" maxlength="6"><button class="btn" id="dv_go" onclick="A.devVerify()">Continue</button>`;
SCREENS.devhome=()=>{
  const d=devNow();if(!d)return empty('Please sign in first.');
  const tab=k=>`<span class="chip ${DV.tab===k?'on':''}" data-tab="${k}" onclick="DV.tab='${k}';DV.made=null;render()">${k==='Team'?'Team ('+activeDevs()+'/'+MAX_DEVS+')':k==='Support'?'Support'+(R.churches.reduce((n,c)=>n+unreadDev(c.id),0)?' ('+R.churches.reduce((n,c)=>n+unreadDev(c.id),0)+')':''):k}</span>`;

  if(DV.tab==='Churches')return head+R.churches.map(c=>{const st=churchStats(c.id),un=unreadDev(c.id);return `<div class="card" data-church="${c.id}"><div class="row" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${badge(c.status,c.status==='active'?'ok':c.status==='suspended'?'w':'g')}</div>

   <input id="dv_nm_${c.id}" value="${esc(c.name)}" aria-label="Church name"><button class="btn ghost s" onclick="A.devRename('${c.id}')">Save name</button>
   ${c.status==='active'?`<button class="btn ghost s" onclick="A.devStatus('${c.id}','suspended')">Pause</button>`:''}${c.status==='suspended'?`<button class="btn ghost s" onclick="A.devStatus('${c.id}','active')">Resume</button>`:''}
   ${c.status!=='archived'?`<button class="btn warn s" onclick="A.devStatus('${c.id}','archived')">Archive</button>`:`<button class="btn ghost s" onclick="A.devStatus('${c.id}','active')">Restore</button>`}
   <button class="btn s" onclick="A.devOpen('${c.id}')">Open as Church Admin</button><button class="btn ok s" onclick="A.devThread('${c.id}')">Support${un?' ('+un+')':''}</button></div>`}).join('');
  if(DV.tab==='New church')return head+(DV.made?`<div class="card" style="background:var(--soft)"><h3>${esc(DV.made.name)} is ready</h3><p>Give this special church number to the church admin and the members:</p><h2 class="num" style="letter-spacing:3px">${fmtNum(DV.made.number)}</h2><p class="mute">The church has its own independent console and database. ${DV.made.adminPhone?'When '+esc(DV.made.adminPhone)+' signs in with this number they become the Church Admin.':''}</p></div>`:'')+
   `<div class="card"><h3>Create a church (clone the client console)</h3><p class="mute">The new church gets its own independent console with the church name written on it. It cannot see any other church.</p>
   <label>Church name</label><input id="nc_name" placeholder="e.g. Kisumu Central SDA Church"><label>Church admin phone</label><input id="nc_admin" inputmode="tel" placeholder="07XXXXXXXX"><label>District</label><input id="nc_dist"><label>Station</label><input id="nc_station"><label>Field / Conference</label><input id="nc_conf"><label>County</label><input id="nc_county">
   <label>Copy settings from</label><select id="nc_from"><option value="">Standard template</option>${R.churches.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
   <label>Church number (leave empty to get one automatically)</label><input id="nc_num" inputmode="numeric" placeholder="e.g. 482-7391"><button class="btn" id="nc_make" onclick="A.devCreate()">Create church</button></div>`;
  if(DV.tab==='Reports'){const mo=nowISO().slice(0,7);const rows=R.churches.map(c=>{const d=R.data[c.id],st=churchStats(c.id),adminIn=d.users.some(x=>x.role==='church_admin'&&!x.archived),days=st.last?Math.floor((Date.now()-Date.parse(st.last))/864e5):999;
      const health=c.status==='archived'?'archived':c.status==='suspended'?'paused':!adminIn?'setup':days<=14?'active':days<=60?'quiet':'dormant';const un=unreadDev(c.id);
      const att=[];if(health==='setup')att.push('The church admin has not signed in yet.');if(health==='quiet')att.push('No activity for over 2 weeks.');if(health==='dormant')att.push('No activity for over 2 months.');if(st.waiting>=5)att.push(st.waiting+' people are waiting to join.');if(un)att.push(un+' unread support message'+(un>1?'s':'')+'.');
      return{c,st,health,att,newM:d.users.filter(x=>(x.createdAt||'').startsWith(mo)).length,rc:(d.receipts||[]).filter(x=>(x.createdAt||'').startsWith(mo)).length,nt:(d.notices||[]).filter(x=>(x.createdAt||'').startsWith(mo)).length,sup:R.support.filter(m=>m.cid===c.id).length}});
    const need=rows.filter(r=>r.att.length&&r.c.status!=='archived');
    return head+`<h3>Church health &amp; usage</h3><p class="mute">Counts only: no money amounts, member names or notice text are shown to developers.</p>
    <div class="card"><b>${rows.length}</b> churches · <b>${rows.filter(r=>r.health==='active').length}</b> active · <b>${rows.filter(r=>r.health==='setup').length}</b> waiting for admin · <b>${rows.reduce((n,r)=>n+r.st.members,0)}</b> members in all</div>
    ${need.length?`<div class="card"><h3>Needs attention</h3>${need.map(r=>`<p><b>${esc(r.c.name)}</b> ${fmtNum(r.c.number)}<br><span class="mute">${r.att.map(esc).join(' · ')}</span></p>`).join('')}</div>`:'<div class="card"><p>Every church is in good shape.</p></div>'}
    ${rows.map(r=>`<div class="card" data-health="${r.health}"><div class="row" style="justify-content:space-between"><h3>${esc(r.c.name)}</h3>${badge(r.health,r.health==='active'?'ok':r.health==='paused'||r.health==='archived'?'g':'w')}</div><p class="mute">${r.st.members} members${r.st.waiting?' (+'+r.st.waiting+' waiting)':''} · ${r.newM} new this month · ${r.rc} receipts · ${r.nt} notices · ${r.sup} support messages</p></div>`).join('')}`}
  if(DV.tab==='Team')return head+`<div class="card"><h3>App developer team (${activeDevs()} of ${MAX_DEVS})</h3>${R.devs.map(x=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span>${esc(x.name)} <span class="mute">${esc(x.phone)}</span> ${badge(x.status,x.status==='active'?'ok':'g')}</span><span>${x.status==='active'?(x.id!==d.id?`<button class="btn warn s" onclick="A.devTeam('${x.id}',false)">Archive</button>`:''):`<button class="btn ghost s" onclick="A.devTeam('${x.id}',true)">Restore</button>`}</span></div>`).join('')}</div>
   <div class="card"><h3>Add a developer</h3><label>Name</label><input id="dt_name"><label>Phone number</label><input id="dt_phone" inputmode="tel"><button class="btn" id="dt_add" onclick="A.devAdd()">Add to the team</button><p class="mute">Up to ${MAX_DEVS} developers can be active at the same time. People leave the team by being archived, never deleted.</p></div>`;
  const cid=DV.thread,c=cid&&churchById(cid);
  if(!c)return head+R.churches.map(x=>`<div class="card" onclick="A.devThread('${x.id}')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><h3>${esc(x.name)}</h3>${unreadDev(x.id)?badge(unreadDev(x.id)+' new','w'):''}</div><p class="mute">${(R.support.filter(m=>m.cid===x.id).slice(-1)[0]||{body:'No messages yet.'}).body.slice(0,80)}</p></div>`).join('');
  return head+`<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(c.name)}</h3><button class="btn ghost s" onclick="DV.thread=null;render()">All churches</button></div><div class="supmsgs" id="dvthread" style="height:auto;max-height:300px">${R.support.filter(m=>m.cid===cid).map(m=>`<div class="supm ${m.from==='developer'?'me':''}"><small>${esc(m.name)} · ${m.from==='admin'?'church admin':'developer'}</small><div>${esc(m.body)}</div></div>`).join('')||'<p class="mute">No messages yet.</p>'}</div>
   <textarea id="dv_tx" rows="2" placeholder="Reply to the church admin"></textarea><button class="btn" id="dv_reply" onclick="A.devReply()">Send reply</button></div>`;
};

Object.assign(A,{
 amGroup(g){const i=AM.groups.indexOf(g);i<0?AM.groups.push(g):AM.groups.splice(i,1);const k={n:v('am_name'),p:v('am_phone'),i:v('am_id'),r:v('am_role')};render();$('am_name').value=k.n;$('am_phone').value=k.p;$('am_id').value=k.i;$('am_role').value=k.r},
 adminAdd(){
   const name=v('am_name').trim(),ph=normPhone(v('am_phone'));
   if(name.length<2||!/^0[17]\d{8}$/.test(ph)){toast('Please write the name and the phone number.');return}
   if(R.bind[ph]&&R.bind[ph]!==R.cur){toast('This number already belongs to another church. They can move to yours with your church number.');return}
   const role=v('am_role')||'member';const prior=S.users.find(x=>x.phone===ph);
   if(prior&&!prior.archived){toast('That person is already a member.');return}
   if(prior){prior.archived=false;delete prior.archivedAt;prior.name=name;prior.role=role;prior.requested=role;prior.roleStatus='approved';prior.groups=AM.groups.slice();prior.join='approved';audit(me().name,'unarchive','users',prior.id,'added again by the church admin')}
   else add('users',{guideSeen:'',name,phone:ph,idNo:v('am_id'),memNo:'',role,requested:role,roleStatus:'approved',former:[],groups:AM.groups.slice(),church:curChurch().name,district:curChurch().district,station:curChurch().station,conf:curChurch().conf,county:curChurch().county,join:'approved'});
   R.bind[ph]=R.cur;AM.showAdd=false;AM.groups=[];save();render();toast('Member added');
 },
 adminArchive(id){const x=S.users.find(y=>y.id===id);if(!x||x.id===S.me)return;if(!confirm(trText('Archive this member?')))return;x.archived=true;x.archivedAt=nowISO();x.archivedBy=me().name;x.archiveReason='archived by church admin';R.bind[x.phone]=null;audit(me().name,'archive','users',id,'archived by church admin');save();render();toast('Member archived. You can restore them later.')},
 adminRestore(id){const x=S.users.find(y=>y.id===id);if(!x)return;if(R.bind[x.phone]&&R.bind[x.phone]!==R.cur){toast('This person now belongs to another church.');return}x.archived=false;delete x.archivedAt;R.bind[x.phone]=R.cur;audit(me().name,'unarchive','users',id);save();render();toast('Restored')},
 adminJoin(id,ok){const x=S.users.find(y=>y.id===id);if(!x)return;
   if(ok){x.join='approved';smsTo(x.phone,'You have been let in to '+curChurch().name+'. Open Church Connect.');pushTo([x],'join',{church:curChurch().name},'home');audit(me().name,'update','users',id,'join approved')}
   else{x.archived=true;x.archivedAt=nowISO();x.archivedBy=me().name;x.archiveReason='join declined';R.bind[x.phone]=null;audit(me().name,'archive','users',id,'join declined')}
   save();render();toast(ok?'Let in':'Declined')},
 adminSetRole(id){const role=v('am_er');if(!role)return;upd('users',id,{role,requested:role,roleStatus:'approved'});AM.editing=null;render();toast('Position saved')},
 adminSave(){const s=S.settings;s.paybill=v('as_pb').replace(/\D/g,'').slice(0,10);s.hint=v('as_hint').trim().slice(0,60);
   const c=[...new Set(v('as_cats').split(',').map(x=>x.trim()).filter(Boolean))].slice(0,20);if(c.length)s.categories=c;
   s.requireJoin=$('as_appr').checked;s.motto=v('as_motto').trim().slice(0,120);audit(me().name,'update','settings','settings');save();render();toast('Your church settings were saved.')},
 mvGroup(g){const i=MV.groups.indexOf(g);i<0?MV.groups.push(g):MV.groups.splice(i,1);render()},
 moveFind(){MV.num=v('mv_num');const n=normNum(MV.num);const ch=validNum(n)&&R.churches.find(c=>c.number===n&&c.status==='active');
   if(!ch){MV.to=null;render();toast('That church number was not found. Check it with your church secretary.');return}
   if(ch.id===R.cur){MV.to=null;render();toast('You already belong to this church.');return}MV.to=ch.id;MV.sent=null;render()},
 moveSend(){MV.sent=String(Math.floor(100000+Math.random()*900000));smsTo(me().phone,'Your Church Connect code is '+MV.sent+'. It expires in 10 minutes. Do not share it.');save();render();toast('Code sent – open the SMS simulator')},
 moveDo(){
   if(v('mv_code').trim()!==MV.sent){toast('That code is not right');return}
   const to=churchById(MV.to),ou=S.users.find(x=>x.id===S.me);if(!to||!ou)return;
   const wasLeader=!['member','former_leader','church_admin'].includes(ou.role);
   const former=[...new Set([...(ou.former||[]),...(wasLeader?[ou.role]:[])])];

const STOP=new Set('a an the and or but if then so of to in on at for with by from as is are was were be been it its this that these those i you he she we they them his her our your their not no do does did have has had will would can could should may might shall into about over under again very just also than too more most some any each who what when where which there here'.split(' '));
function extract(t,target){
  const sents=t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(s=>s.length>25);if(!sents.length)return t;
  const f={};sents.forEach(s=>(s.toLowerCase().match(/[a-z']+/g)||[]).forEach(w=>{if(!STOP.has(w)&&w.length>2)f[w]=(f[w]||0)+1}));
  const sc=sents.map(s=>{const w=s.toLowerCase().match(/[a-z']+/g)||[];return w.reduce((a,x)=>a+(f[x]||0),0)/Math.sqrt(w.length+1)+(/\d+:\d+/.test(s)?3:0)});
  const ord=sents.map((_,i)=>i).sort((a,b)=>sc[b]-sc[a]);const keep=new Set();let n=0;
  for(const i of ord){const l=sents[i].split(' ').length;if(n+l>target&&keep.size)continue;keep.add(i);n+=l;if(n>=target)break}
  return [...keep].sort((a,b)=>a-b).map(i=>sents[i]).join(' ');
}

/* a person only gets pushes if they switched notifications on (default on in the preview) */
function pushTo(users,kind,args,screen){
  const seen=new Set();
  users.forEach(u=>{if(!u||seen.has(u.id)||u.archived||u.join==='pending'||u.push===false)return;seen.add(u.id);
    const lang=u.lang==='sw'?'sw':'en';const t=PUSHT[kind](args)[lang];
    const m={id:uid(),at:nowISO(),cid:R.cur,uid:u.id,to:u.name,role:u.role,title:t[0],body:t[1],screen:screen||'home',lang};R.push.push(m);
    if(S.me===u.id&&R.cur===m.cid)showBanner(m)})
}

const obMine=()=>(S.outbox||[]).filter(x=>me()&&x.uid===me().id);
const _addOrig=add;
add=function(col,rec){
  if(OFFLINE&&OB_COLS.includes(col)&&me()){
    if(obMine().length>=200){toast('Too many things are waiting to be sent. Connect to the internet first.');return {id:'full'}}
    if(!S.outbox)S.outbox=[];
    S.outbox.push({key:uid(),uid:me().id,col,rec:rec,title:String(rec.title||rec.kind||col),at:nowISO()});save();
    toast('Saved on this phone. It will be sent automatically when you are back online.');
    return Object.assign({id:'queued'},rec);
  }
  return _addOrig(col,rec);
};
const _pushTo=pushTo;pushTo=function(){if(OFFLINE)return;return _pushTo.apply(this,arguments)};
function obFlush(){
  const mine=obMine();if(!mine.length)return 0;
  let sent=0;if(!S.obRejected)S.obRejected=[];
  mine.forEach(it=>{
    const u=me();
    S.outbox=S.outbox.filter(x=>x!==it);
    // the church re-checks everything when it is finally sent (same as the server)
    if(it.col==='minutes'&&!['secretary','pastor'].includes(u.role)){S.obRejected.push(Object.assign({},it,{reason:'Only the Church Secretary or Pastor can add minutes.'}));return}
    if(it.col==='payments'){
      const p=S.payments.find(x=>x.id===it.pid);
      if(!p||p.status!=='pending'){sent++;return}  // already confirmed: nothing left to do
      const vs=p.verification&&p.verification.state;
      if(S.mpesaOn&&vs!=='verified'){S.obRejected.push(Object.assign({},it,{reason:vs==='amount_mismatch'?'M-Pesa shows '+ksh(p.verification.mpesaAmount)+' for this code, but the member said '+ksh(p.amount)+'. Confirm only if you have checked.':'This code has not appeared on the Pay Bill yet. Wait a few minutes, or confirm only if you have checked the M-Pesa statement.'}));return}
      _recvOrig(it.pid);sent++;return;
    }
    const n=_addOrig(it.col,Object.assign({},it.rec,{createdAt:it.at}));sent++;
    if(it.col==='notices'){const r=it.rec;
      if(r.status==='pending')pushTo(S.users.filter(x=>!x.archived&&x.roleStatus==='approved'&&LEADS[x.role]===r.groupKey),'approval',{title:r.title},'group');
      else pushTo(noticeReaders(n,it.uid),'notice',{board:BOARDN[r.board],group:r.groupKey?GROUPN[r.groupKey]:null,title:r.title},r.board==='camp'?'camp':r.board==='group'?'group':'church');}
  });
  save();return sent+0;
}
const _recvOrig=A.receive;
A.receive=function(id){
  if(OFFLINE&&me()&&me().role==='treasurer'){
    const p=S.payments.find(x=>x.id===id);if(!p||p.status!=='pending')return;
    if(obMine().some(x=>x.pid===id))return;
    if(!S.outbox)S.outbox=[];
    S.outbox.push({key:uid(),uid:me().id,col:'payments',pid:id,title:p.memberName+' '+ksh(p.amount),at:nowISO()});save();
    toast('Saved on this phone. It will be sent automatically when you are back online.');render();return;
  }
  return _recvOrig.apply(A,arguments);
};
A.hideRej=function(k){const r=(S.obRejected||[]).find(x=>x.key===k);if(r)r.hidden=true;save();render()};
const obRej=()=>(S.obRejected||[]).filter(x=>me()&&x.uid===me().id&&!x.hidden);
A.toggleNet=function(){
  OFFLINE=!OFFLINE;
  if(OFFLINE){toast('Offline: you can still write minutes, notices, activities and records. Payments need internet.')}
  else{const r0=obRej().length,n=obFlush(),rj=obRej().length-r0;toast(n?n+' item(s) sent.'+(rj?' '+rj+' not accepted.':''):rj?rj+' not accepted.':'Back online.')}
  render();
};
A.sendNow=function(){if(OFFLINE){toast('Still no connection. They will be sent automatically when you are back online.');return}const n=obFlush();toast(n+' item(s) sent.');render()};

er belongs to another church. They can move to yours with your church number.":"Nambari hii iko kanisa lingine. Wanaweza kuhamia kwako kwa nambari ya kanisa lako."});
const SWT=Object.keys(SWD).filter(k=>k.includes('{0}')).map(k=>{const names=[];const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\d)\}/g,(_,i)=>{names.push(+i);return '(.+?)'})+'$');return {re,names,to:SWD[k]}});
function trText(t){
  if(LANG!=='sw'||!t)return t;
  const m=t.match(/^(\s*)([\s\S]*?)(\s*)$/);const core=m[2];
  if(SWD[core])return m[1]+SWD[core]+m[3];
  for(const x of SWT){const r=core.match(x.re);if(r)return m[1]+x.to.replace(/\{(\d)\}/g,(_,i)=>{const j=x.names.indexOf(+i);return trText(r[j+1])})+m[3]}
  return t;
}
function translateDOM(){
  if(LANG!=='sw')return;
  const w=document.createTreeWalker(document.getElementById('wrap'),NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const v=trText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{e.placeholder=trText(e.placeholder)});
}

/* ---------- giving statement and treasurer's monthly report ---------- */
const keDate=iso=>new Date(Date.parse(iso)+3*3600e3).toISOString().slice(0,10);
const csvCell=v=>{let t=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(t)&&typeof v!=='number')t="'"+t;return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const sumBy=items=>{const m={};items.forEach(i=>i.allocations.forEach(a=>m[a.category]=Math.round(((m[a.category]||0)+a.amount)*100)/100));return m};
let ST={year:null,member:null},RP={month:null};
const nowKE=()=>new Date(Date.now()+3*3600e3);
function stmtData(mid,year){
  const m=S.users.find(x=>x.id===mid);
  const items=S.receipts.filter(r=>r.memberId===mid&&keDate(r.createdAt).startsWith(String(year))).map(r=>({date:keDate(r.createdAt),no:r.no,amount:r.amount,allocations:r.allocations||[]}));
  const by=sumBy(items),total=items.reduce((a,i)=>a+i.amount,0);
  const cn=c=>LANG==='sw'?(SWD[c]||c):c;
  const text=[L2('GIVING STATEMENT','TAARIFA YA UTOAJI')+' '+year,m.church,'',L2('Member','Mshiriki')+': '+m.name,L2(`Period: 1 January ${year} to 31 December ${year}`,`Kipindi: 1 Januari ${year} hadi 31 Desemba ${year}`),'',
   ...(items.length?items.map(i=>`${i.date}  ${i.no}  ${ksh(i.amount)}\n    ${i.allocations.map(a=>cn(a.category)+' '+ksh(a.amount)).join(', ')}`):[L2('No receipted giving in this year.','Hakuna utoaji uliotolewa risiti katika mwaka huu.')]),
   '',L2('Totals by purpose:','Jumla kwa madhumuni:'),...Object.entries(by).map(([k,v])=>`  ${cn(k)}: ${ksh(v)}`),L2('TOTAL GIVEN','JUMLA ILIYOTOLEWA')+': '+ksh(total),'',
   L2('This statement lists only payments the Church Treasurer has receipted. Thank you for your faithfulness. God bless you.','Taarifa hii inaorodhesha malipo ambayo Mweka Hazina wa Kanisa ameyatolea risiti pekee. Asante kwa uaminifu wako. Mungu akubariki.')].join('\n');
  return {m,items,by,total,text};
}
SCREENS.statement=()=>{
  const u=me(),canPick=['treasurer','pastor'].includes(u.role);
  const y0=nowKE().getUTCFullYear();const years=[y0,y0-1,y0-2].map(String);
  ST.year=ST.year||years[0];
  if(!canPick||!ST.member)ST.member=canPick?(ST.member||u.id):u.id;
  const givers=canPick?[...new Map(S.receipts.map(r=>[r.memberId,r.memberName]))]:[];

  `<label>Year</label>${chips(years,String(ST.year),'A.stYear')}
  <div class="card"><h3>Giving Statement ${ST.year}</h3><p class="mute">Only payments the Treasurer has receipted are counted.</p>${d.items.length?`<p><b>Total given: ${ksh(d.total)}</b></p>`:empty('No receipted giving in this year.')}</div>
  <div class="receipt" id="stmt">${esc(d.text)}</div><div class="noprint"><button class="btn" onclick="window.print()">Print / save as PDF</button></div>`;
};
SCREENS.report=()=>{
  const u=me();if(!['treasurer','pastor'].includes(u.role))return empty('Only the Treasurer or Pastor can see this report.');
  const n=nowKE();const months=Array.from({length:6},(_,i)=>new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-i,1)).toISOString().slice(0,7));
  RP.month=RP.month||months[0];

  const by=sumBy(items),total=items.reduce((a,i)=>a+i.amount,0),pend=S.payments.filter(p=>p.status==='pending'&&!p.archived).length;

  <div class="card"><h3>${RP.month}</h3><p>Receipts issued: ${rows.length}</p><p><b>Total receipted: ${ksh(total)}</b></p>${Object.entries(by).map(([k,v])=>`<p class="mute">${esc(k)}: ${ksh(v)}</p>`).join('')}${pend?`<p>Payments still waiting to be receipted: ${pend}</p>`:''}</div>
  <div class="noprint"><button class="btn" onclick="A.csv()">Download spreadsheet (CSV)</button></div><p class="mute">Opens in Excel or Google Sheets.</p>`;
};
Object.assign(A,{
 stYear(y){ST.year=y;render()},
 rpMonth(m){RP.month=m;render()},
 csv(){
   const rows=S.receipts.filter(r=>keDate(r.createdAt).startsWith(RP.month)).map(r=>({...r,allocations:r.allocations||[]}));
   const cats=[...new Set(rows.flatMap(r=>r.allocations.map(a=>a.category)))].sort(),by=sumBy(rows),total=rows.reduce((a,r)=>a+r.amount,0);
   const line=c=>c.map(csvCell).join(',');
   const out=[line(['Date','Receipt no','Member','M-Pesa code','Total (KSh)',...cats,'Receipted by'])];
   rows.forEach(r=>out.push(line([keDate(r.createdAt),r.no,r.memberName,r.mpesaCode||'',r.amount,...cats.map(c=>(r.allocations.find(a=>a.category===c)||{}).amount||0),r.issuedBy||''])));
   out.push(line(['TOTAL','','','',total,...cats.map(c=>by[c]||0),'']));
   const blob=new Blob(['﻿'+out.join('\r\n')+'\r\n'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='church-report-'+RP.month+'.csv';a.click();toast('Spreadsheet downloaded');
 }
});

/* sermon job simulation: uploading -> converting -> writing, then quick + full + kids summaries */
function startJob(tr,title,pre){
  SM.job={stage:'Uploading the recording…',pct:10};nav=[{s:'home'},{s:'care'},{s:'sermon'}];render();
  const steps=[[900,'Converting the audio…',35],[900,'Writing the transcript…',60],[1000,'Writing the summaries…',85]];
  let t=0;steps.forEach(([d,st,pct])=>{t+=d;setTimeout(()=>{if(!SM.job)return;SM.job={stage:st,pct};if(nav[nav.length-1].s==='sermon')render()},t)});
  setTimeout(()=>{

let BK={csv:'',res:null,phones:true,dir:null};
const BK_TEMPLATE='Name,Phone,Role,ID number,Groups\nMary Wanjiku,0711222333,Church Treasurer,12345678,Dorcas; Church Choir\nPeter Otieno,0722333444,Member,,Adventist Men';
const bkNorm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function bkParse(text){let t=String(text||'').replace(/^﻿/,'');const f=t.split(/\r?\n/,1)[0]||'';const cnt=ch=>{let n=0,q=false;for(const c of f){if(c==='"')q=!q;else if(c===ch&&!q)n++}return n};
  const D=[',',';','\t'].map(d=>[d,cnt(d)]).sort((a,b)=>b[1]-a[1])[0];const sep=D[1]>0?D[0]:',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"')q=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const BK_HEAD={name:['name','full name','jina','jina kamili'],phone:['phone','phone number','mobile','simu','nambari ya simu'],role:['role','position','nafasi'],idNo:['id','id number','kitambulisho'],groups:['groups','group','vikundi','kikundi']};
const bkRole=txt=>{const t=bkNorm(txt);if(!t||t==='member'||t==='mshiriki')return 'member';if(t==='former leader'||t==='advisor')return 'former_leader';const r=ROLES.find(r=>bkNorm(r[0])===t||bkNorm(r[1])===t||bkNorm(trText(r[1]))===t);return r?r[0]:null};
const bkGroups=txt=>{const keys=[];String(txt||'').split(/[;|\/]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{const t=bkNorm(p);const g=GROUPS.find(g=>bkNorm(g[0])===t||bkNorm(g[1])===t||bkNorm(trText(g[1]))===t);if(g&&!keys.includes(g[0]))keys.push(g[0])});return keys};
function bkRun(commit){
  const rows=bkParse(BK.csv);if(rows.length<2){toast('Paste a list with a first row (Name, Phone...) and at least one member.');return null}
  const cols=rows[0].map(h=>Object.keys(BK_HEAD).find(k=>BK_HEAD[k].includes(bkNorm(h))));
  if(!cols.includes('name')||!cols.includes('phone')){toast('The first row must have a Name column and a Phone column.');return null}
  if(rows.length-1>500){toast('Please import at most 500 people at a time.');return null}
  const seen=new Set(),results=[];
  rows.slice(1).forEach((r,i)=>{const o={};cols.forEach((f,j)=>{if(f)o[f]=String(r[j]==null?'':r[j]).trim()});
    const role=bkRole(o.role),ph=normPhone(o.phone||''),out={line:i+2,name:(o.name||'').slice(0,100),phone:ph,status:'ready',problem:''};
    if(out.name.length<2){out.status='skipped';out.problem="Write the member's name."}
    else if(!/^0[17]\d{8}$/.test(ph)){out.status='skipped';out.problem='Enter a valid Kenyan phone number.'}
    else if(role===null){out.status='skipped';out.problem='Unknown role.'}
    else if(seen.has(ph)){out.status='skipped';out.problem='This phone number appears twice in the file.'}
    else{seen.add(ph);const prior=S.users.find(x=>x.phone===ph);
      if(R.bind[ph]&&R.bind[ph]!==R.cur){out.status='skipped';out.problem='This number belongs to another church. They can move to yours with your church number.'}
      else if(prior&&!prior.archived){out.status='skipped';out.problem='That person is already a member of this church.'}
      else if(commit){const groups=bkGroups(o.groups);
        if(prior){prior.archived=false;delete prior.archivedAt;prior.name=out.name;prior.role=role;prior.requested=role;prior.roleStatus='approved';prior.groups=groups;prior.join='approved';audit(me().name,'unarchive','users',prior.id,'added again by import')}
        else add('users',{guideSeen:'',name:out.name,phone:ph,idNo:o.idNo||'',memNo:'',role,requested:role,roleStatus:'approved',former:[],groups,church:curChurch().name,district:curChurch().district,station:curChurch().station,conf:curChurch().conf,county:curChurch().county,join:'approved'});
        R.bind[ph]=R.cur;out.status='added'}}
    results.push(out)});
  const n=s=>results.filter(x=>x.status===s).length;if(commit){audit(me().name,'import','users','',n('added')+' added, '+n('skipped')+' skipped');save()}
  return{committed:!!commit,ready:n('ready'),added:n('added'),skipped:n('skipped'),results}}
const bkDirText=()=>{const lang=LANG==='sw';const list=S.users.filter(x=>!x.archived&&x.join!=='pending');const line=m=>'  '+m.name+(BK.phones&&m.phone?'  '+m.phone:'');
  const lead=list.filter(m=>m.role!=='member'&&m.role!=='former_leader').sort((a,b)=>rl(a.role).localeCompare(rl(b.role))||a.name.localeCompare(b.name)),rest=list.filter(m=>!lead.includes(m)).sort((a,b)=>a.name.localeCompare(b.name));
  return [lang?'ORODHA YA WASHIRIKI':"MEMBERS' DIRECTORY",curChurch().name,(lang?'Jumla ya washiriki: ':'Total members: ')+list.length,'',lang?'Viongozi':'Leaders',...lead.map(m=>line(m)+'  ('+rl(m.role)+')'),'',lang?'Washiriki':'Members',...rest.map(line)].join('\n')};
const bkCell=v=>{let t=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return /[",\n\r;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};

yoongozwa na Mchungaji, kuamua.", "Minute Vault": "Hazina ya Muhtasari wa Vikao", "Keep the minutes of every meeting here. Minutes are never deleted; mistakes are archived and re-entered.": "Hifadhi muhtasari wa kila kikao hapa. Muhtasari haufutwi; makosa yanahifadhiwa kwenye kumbukumbu na kuingizwa upya.", "Church notice board": "Ubao wa matangazo wa kanisa", "Leaders post here and only you archive old notices.": "Viongozi wanatuma hapa na ni wewe tu unayehifadhi matangazo ya zamani kwenye kumbukumbu.", "Your Clerk dashboard": "Dashibodi yako ya Karani", "Membership records": "Kumbukumbu za uanachama", "You keep the membership list together with the Secretary: baptisms and transfers.": "Unatunza orodha ya wanachama pamoja na Katibu: ubatizo na uhamisho.", "Office records": "Kumbukumbu za ofisi", "Use Office Records for correspondence and registers. Each entry is dated and kept.": "Tumia Kumbukumbu za Ofisi kwa barua na orodha. Kila ingizo lina tarehe na linahifadhiwa.", "Boards and activities": "Mbao na shughuli", "Post to the church board and plan activities.": "Tuma kwenye ubao wa kanisa na upange shughuli.", "Your Pastor dashboard": "Dashibodi yako ya Mchungaji", "Church Board decisions": "Maamuzi ya Bodi ya Kanisa", "Transfer applications wait for you. Approve or decline, and the member gets their number.": "Maombi ya uhamisho yanakusubiri. Kubali au kataa, na mshiriki anapata nambari yake.", "Verify positions": "Thibitisha nafasi", "You can verify leader positions together with the Secretary.": "Unaweza kuthibitisha nafasi za uongozi pamoja na Katibu.", "Sermon recorder": "Kinasa mahubiri", "Record the sermon and stop: the quick, full and children's summaries appear in Pastoral Care after a few minutes.": "Rekodi mahubiri kisha simamisha: muhtasari mfupi, kamili na wa watoto unaonekana kwenye Huduma ya Kichungaji baada ya dakika chache.", "Pastoral Care messages": "Jumbe za Huduma ya Kichungaji", "Post a daily or weekly message. Members can listen to it read aloud.": "Tuma ujumbe wa kila siku au kila wiki. Washiriki wanaweza kuusikiliza ukisomwa.", "Overview": "Muhtasari", "You can read payments, welfare, attendance, pledges and camp registrations to care for the whole church.": "Unaweza kusoma malipo, ustawi, mahudhurio, ahadi na usajili wa kambi ili kulihudumia kanisa zima.", "Your Sabbath School dashboard": "Dashibodi yako ya Shule ya Sabato", "Attendance register": "Daftari la mahudhurio", "Each Sabbath, record every class: how many are on the roll and how many came, plus visitors and the lesson. The classes are remembered for next week.": "Kila Sabato, rekodi kila darasa: wangapi wako kwenye orodha na wangapi walikuja, pamoja na wageni na somo. Madarasa yanakumbukwa kwa wiki ijayo.", "Activities": "Shughuli", "Plan Sabbath School programs and events on the calendar.": "Panga programu na matukio ya Shule ya Sabato kwenye kalenda.", "Correcting a record": "Kusahihisha rekodi", "One record per Sabbath. To correct it, archive it and record again. Nothing is deleted.": "Rekodi moja kwa kila Sabato. Kusahihisha, ihifadhi kwenye kumbukumbu kisha rekodi tena. Hakuna kinachofutwa.", "Your Education dashboard": "Dashibodi yako ya Elimu", "Keep education plans, reports and registers in Office Records.": "Hifadhi mipango, ripoti na orodha za elimu kwenye Kumbukumbu za Ofisi.", "Plan education events and invite the church through the notice board.": "Panga matukio ya elimu na ulikaribishe kanisa kupitia ubao wa matangazo.", "Your Elder dashboard": "Dashibodi yako ya Mzee wa Kanisa", "Support the Pastor": "Msaidie Mchungaji", "Elders assist the Pastor in spiritual care and oversight of the church.": "Wazee wanamsaidia Mchungaji katika huduma ya kiroho na usimamizi wa kanisa.", "Sermon summaries": "Muhtasari wa mahubiri", "You can record a sermon and create its summaries, just as the Pastor can.": "Unaweza kurekodi mahubiri na kutengeneza muhtasari wake, kama Mchungaji.", "Your Camp Meeting dashboard": "Dashibodi yako ya Mkutano wa Kambi", "Camp Meeting board": "Ubao wa Mkutano wa Kambi", "Camp officers and the Pastor post here for the whole church.": "Maafisa wa kambi na Mchungaji wanatuma hapa kwa kanisa zima.", "Registration": "Usajili", "Members register themselves. You can register others, set the fee, record payments and check people in on arrival.": "Washiriki wanajisajili wenyewe. Unaweza kusajili wengine, kuweka ada, kurekodi malipo na kuwapokea wanapofika.", "Plan camp programs on the calendar.": "Panga programu za kambi kwenye kalenda.", "Your Building Committee dashboard": "Dashibodi yako ya Kamati ya Ujenzi", "Building project": "Mradi wa ujenzi", "Record contributions and spending for the Church Building project. Members' building gifts are posted automatically when the Treasurer confirms them.": "Rekodi michango na matumizi ya mradi wa Ujenzi wa Kanisa. Michango ya ujenzi ya washiriki inawekwa moja kwa moja Mweka Hazina anapothibitisha.", "Pledges": "Ahadi", "Record what each person has promised and add payments as they come. The balance and overdue pledges show at a glance.": "Rekodi kila mtu alichoahidi na ongeza malipo yanapofika. Salio na ahadi zilizochelewa zinaonekana kwa haraka.", "Your Special Groups dashboard": "Dashibodi yako ya Vikundi Maalum", "Plan occasions": "Panga matukio", "Plan special groups and occasions on the calendar.": "Panga vikundi maalum na matukio kwenye kalenda.", "Keep plans, reports and registers in Office Records.": "Hifadhi mipango, ripoti na orodha kwenye Kumbukumbu za Ofisi.", "Your group dashboard": "Dashibodi ya kikundi chako", "Your group board": "Ubao wa kikundi chako", "Post freely to your group board. Other members' posts wait for your approval.": "Tuma kwa uhuru kwenye ubao wa kikundi chako. Ujumbe wa washiriki wengine unasubiri idhini yako.", "Approve posts": "Idhinisha ujumbe", "Open the group board to approve or archive posts. Nothing is ever deleted.": "Fungua ubao wa kikundi kuidhinisha au kuhifadhi ujumbe. Hakuna kinachofutwa kamwe.", "Activities and members": "Shughuli na wanakikundi", "Plan group activities and see who belongs to the group.": "Panga shughuli za kikundi na uone wanaomo kwenye kikundi."});

 guideDone(){const u=S.users.find(x=>x.id===S.me);if(u){u.guideSeen=guideRole();save()}GI=0;nav=[{s:'home'}];render()}});

A.printCard=function(){

const _render0=render;
render=function(){const u=S.users.find(x=>x.id===S.me&&!x.archived);

/* ---------- yearly church report (same figures and wording as the server: GET /reports/yearly/:year) ---------- */
const RPT={"en": {"title": "Annual Church Report", "giving": "Giving (receipted)", "total": "Total received", "receipts": "Receipts issued", "byCat": "By purpose", "byMonth": "By month", "members": "Membership", "active": "Members on the roll at year end", "bapt": "Baptisms in the year", "trIn": "Transfers received", "trWait": "Transfer applications still waiting", "joined": "New app sign-ups", "ss": "Sabbath School", "weeks": "Sabbaths recorded", "avg": "Average present", "visitors": "Visitors in total", "welfare": "Welfare funds", "fund": "Fund", "contrib": "Contributions", "building": "Church Building", "income": "Contributions", "spent": "Spent", "pledged": "Pledged", "paid": "Paid on pledges", "balance": "Pledge balance", "camp": "Camp meeting", "regs": "Registrations", "fees": "Fees set", "feesPaid": "Fees paid", "other": "Church life", "acts": "Activities planned", "mins": "Minutes kept", "serm": "Sermon summaries", "year": "Year", "church": "Church", "gen": "Prepared", "note": "Totals only. No individual member's giving is shown in this report."}, "sw": {"title": "Ripoti ya Mwaka ya Kanisa", "giving": "Utoaji (uliotolewa risiti)", "total": "Jumla iliyopokelewa", "receipts": "Risiti zilizotolewa", "byCat": "Kwa madhumuni", "byMonth": "Kwa mwezi", "members": "Uanachama", "active": "Wanachama kwenye orodha mwisho wa mwaka", "bapt": "Ubatizo katika mwaka", "trIn": "Uhamisho uliopokelewa", "trWait": "Maombi ya uhamisho yanayosubiri", "joined": "Waliojiunga na programu", "ss": "Shule ya Sabato", "weeks": "Sabato zilizorekodiwa", "avg": "Wastani wa waliohudhuria", "visitors": "Wageni kwa jumla", "welfare": "Mifuko ya ustawi", "fund": "Mfuko", "contrib": "Michango", "building": "Ujenzi wa Kanisa", "income": "Michango", "spent": "Iliyotumika", "pledged": "Ahadi", "paid": "Iliyolipwa kwa ahadi", "balance": "Salio la ahadi", "camp": "Mkutano wa kambi", "regs": "Waliosajiliwa", "fees": "Ada zilizowekwa", "feesPaid": "Ada zilizolipwa", "other": "Maisha ya kanisa", "acts": "Shughuli zilizopangwa", "mins": "Muhtasari wa vikao uliohifadhiwa", "serm": "Muhtasari wa mahubiri", "year": "Mwaka", "church": "Kanisa", "gen": "Imeandaliwa", "note": "Jumla tu. Utoaji wa mshiriki yeyote hauonyeshwi kwenye ripoti hii."}};
Object.assign(SWD,{"Annual Church Report":"Ripoti ya Mwaka ya Kanisa","Totals only. No member's own giving is shown here.":"Jumla tu. Utoaji wa mshiriki yeyote hauonyeshwi hapa.","Share / print":"Shiriki / chapisha","Year":"Mwaka"});
const YR={year:null};
function yearlyText(Y,sw){
  const L=RPT[sw?'sw':'en'],num=v=>Number.isFinite(Number(v))?Number(v):0,r2=n=>Math.round(n*100)/100,k=n=>'KSh '+Number(n).toLocaleString('en-KE',{maximumFractionDigits:2});
  const live=a=>(a||[]).filter(x=>!x.archived),inY=d=>String(d||'').startsWith(Y),day=x=>keDate(x.createdAt||nowISO());
  const rc=S.receipts.filter(r=>keDate(r.createdAt).startsWith(Y)),cats={};
  rc.forEach(r=>(r.allocations||[]).forEach(a=>{cats[a.category]=r2((cats[a.category]||0)+a.amount)}));
  const gTotal=r2(rc.reduce((t,r)=>t+r.amount,0));
  const ms=live(S.memberships),onRoll=ms.filter(m=>m.status==='active'&&day(m)<=Y+'-12-31').length,bapt=ms.filter(m=>m.entry==='baptism'&&m.status==='active'&&inY(m.baptismDate||m.date||day(m))).length;
  const trIn=ms.filter(m=>m.entry==='transfer'&&m.status==='active'&&inY(day(m))).length,trWait=ms.filter(m=>m.status==='application').length;
  const signups=S.users.filter(u=>!u.archived&&u.join!=='pending'&&inY(keDate(u.createdAt||nowISO()))).length;
  const off=live(S.office),att=off.filter(o=>o.kind==='attendance'&&inY(o.date)),pres=o=>(o.classes||[]).reduce((t,c)=>t+num(c.present),0);
  const avg=att.length?Math.round(att.reduce((t,o)=>t+pres(o),0)/att.length):0,vis=att.reduce((t,o)=>t+num(o.visitors),0);
  const wel={};live(S.welfare).filter(x=>inY(day(x))&&x.kind!=='case').forEach(w=>{wel[w.fund]=r2((wel[w.fund]||0)+num(w.amount))});
  const pr=live(S.projects).filter(x=>inY(day(x))),pls=off.filter(o=>o.office==='building'&&o.kind==='pledge'&&inY(day(o))),ids=new Set(off.filter(o=>o.office==='building'&&o.kind==='pledge').map(o=>o.id));
  const pp=off.filter(o=>o.kind==='pledge_payment'&&ids.has(o.pledgeId)&&inY(o.date||day(o)));
  const inc=r2(pr.filter(x=>x.kind==='contribution').reduce((t,x)=>t+num(x.amount),0)),spent=r2(pr.filter(x=>x.kind==='expense').reduce((t,x)=>t+num(x.amount),0));
  const pled=r2(pls.reduce((t,x)=>t+num(x.amount),0)),pd=r2(pp.reduce((t,x)=>t+num(x.amount),0));
  const cr=live(S.campreg).filter(x=>inY(day(x)));
  const acts=live(S.activities).filter(x=>inY(x.date||day(x))).length,mins=live(S.minutes).filter(x=>inY(x.date||day(x))).length,serm=live(S.sermons).filter(x=>inY(day(x))).length;
  return [`${L.title} ${Y}`,curChurch().name,`${L.gen}: ${keDate(nowISO())}`,'',L.giving,`  ${L.total}: ${k(gTotal)}`,`  ${L.receipts}: ${rc.length}`,...(Object.keys(cats).length?[`  ${L.byCat}:`,...Object.entries(cats).map(([c,a])=>`    ${c}: ${k(a)}`)]:[]),'',
   L.members,`  ${L.active}: ${onRoll}`,`  ${L.bapt}: ${bapt}`,`  ${L.trIn}: ${trIn}`,`  ${L.trWait}: ${trWait}`,`  ${L.joined}: ${signups}`,'',
   L.ss,`  ${L.weeks}: ${att.length}`,`  ${L.avg}: ${avg}`,`  ${L.visitors}: ${vis}`,'',L.welfare,...(Object.keys(wel).length?Object.entries(wel).map(([f,a])=>`  ${f}: ${k(a)}`):['  —']),'',
   L.building,`  ${L.income}: ${k(inc)}`,`  ${L.spent}: ${k(spent)}`,`  ${L.pledged}: ${k(pled)}`,`  ${L.paid}: ${k(pd)}`,`  ${L.balance}: ${k(Math.max(0,pled-pd))}`,'',
   L.camp,`  ${L.regs}: ${cr.length}`,`  ${L.fees}: ${k(r2(cr.reduce((t,x)=>t+num(x.fee),0)))}`,`  ${L.feesPaid}: ${k(r2(cr.reduce((t,x)=>t+num(x.paid),0)))}`,'',
   L.other,`  ${L.acts}: ${acts}`,`  ${L.mins}: ${mins}`,`  ${L.serm}: ${serm}`,'',L.note].join('\n');
}
SCREENS.yearly=()=>{

const emptyMinutes = ()               => ({ kind: '', date: '', time: '', venue: '', chair: '', secretary: '', present: '', apologies: '', agenda: '', resolutions: '', actions: '', nextDate: '', nextTime: '' });

/** Turns typed lines ("1. Opening", "- Budget", "• Camp") into clean items, dropping empty lines and list marks. */
const lines = (s        )           => String(s || '').split(/\r?\n/).map((x) => x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean);

const W = {
  en: { minutes: 'MINUTES OF THE', notice: 'NOTICE OF', date: 'Date', time: 'Time', venue: 'Venue', chair: 'Chair', secretary: 'Secretary', present: 'Present', apologies: 'Apologies', agenda: 'AGENDA', resolutions: 'RESOLUTIONS', actions: 'ACTION ITEMS', next: 'NEXT MEETING', at: 'at', closing: 'The meeting closed with prayer.', will: 'will be held', on: 'on', all: 'All members of the board are asked to attend.', recorded: 'Minutes recorded by' },
  sw: { minutes: 'MUHTASARI WA', notice: 'TANGAZO LA', date: 'Tarehe', time: 'Saa', venue: 'Mahali', chair: 'Mwenyekiti', secretary: 'Katibu', present: 'Waliohudhuria', apologies: 'Waliotoa udhuru', agenda: 'AJENDA', resolutions: 'MAAZIMIO', actions: 'MAMBO YA KUTEKELEZA', next: 'KIKAO KIJACHO', at: 'saa', closing: 'Kikao kilifungwa kwa maombi.', will: 'kitafanyika', on: 'tarehe', all: 'Wajumbe wote wanaombwa kuhudhuria.', recorded: 'Muhtasari umeandikwa na' },
};
const numbered = (items          ) => items.map((x, i) => `  ${i + 1}. ${x}`);

function composeMinutes(i              , sw = false)                                  {
  const w = sw ? W.sw : W.en; const kind = i.kind.trim() || (sw ? 'KIKAO' : 'MEETING');
  const out           = [`${w.minutes} ${kind.toUpperCase()}`];
  const meta = [i.date && `${w.date}: ${i.date}`, i.time && `${w.time}: ${i.time}`, i.venue && `${w.venue}: ${i.venue}`].filter(Boolean).join('   '); if (meta) out.push(meta);
  const who = [i.chair && `${w.chair}: ${i.chair}`, i.secretary && `${w.secretary}: ${i.secretary}`].filter(Boolean).join('   '); if (who) out.push(who);
  const att = [i.present.trim() && `${w.present}: ${i.present.trim()}`, i.apologies.trim() && `${w.apologies}: ${i.apologies.trim()}`].filter(Boolean).join('   '); if (att) out.push(att);
  const ag = lines(i.agenda), rs = lines(i.resolutions), ac = lines(i.actions);
  if (ag.length) out.push('', w.agenda, ...numbered(ag));
  if (rs.length) out.push('', w.resolutions, ...numbered(rs));
  if (ac.length) out.push('', w.actions, ...numbered(ac));
  if (i.nextDate.trim()) out.push('', `${w.next}: ${i.nextDate.trim()}${i.nextTime.trim() ? ` ${w.at} ${i.nextTime.trim()}` : ''}`);
  out.push('', w.closing);
  if (i.secretary.trim()) out.push(`${w.recorded} ${i.secretary.trim()}.`);
  return { title: `${kind} – ${i.date.trim() || (sw ? 'tarehe haijaandikwa' : 'date not written')}`, body: out.join('\n') };
}

/** A notice of a meeting, ready to post on the church notice board. Uses the "next meeting" date when the minutes have one. */
function composeNotice(i              , sw = false, useNext = false)                                  {
  const w = sw ? W.sw : W.en; const kind = i.kind.trim() || (sw ? 'Kikao' : 'Meeting');
  const date = (useNext ? i.nextDate : i.date).trim(), time = (useNext ? i.nextTime : i.time).trim(), venue = i.venue.trim();
  const when = [date && `${w.on} ${date}`, time && `${w.at} ${time}`].filter(Boolean).join(' ');
  const out = [`${kind} ${w.will}${when ? ' ' + when : ''}${venue ? ` (${venue})` : ''}.`];
  const ag = lines(useNext ? '' : i.agenda); if (ag.length) out.push('', w.agenda + ':', ...numbered(ag));
  out.push('', w.all);
  return { title: `${w.notice} ${kind.toUpperCase()}${date ? ' – ' + date : ''}`, body: out.join('\n') };
}

 allStatements(){const Y=RP.month.slice(0,4),rc=S.receipts.filter(r=>keDate(r.createdAt).startsWith(Y)).map(r=>({...r,allocations:r.allocations||[]})),cats=[...new Set(rc.flatMap(r=>r.allocations.map(a=>a.category)))].sort(),by={};
   rc.forEach(r=>{(by[r.memberId]=by[r.memberId]||{name:r.memberName,items:[]}).items.push(r)});
   const people=Object.entries(by).map(([id,m])=>{const us=S.users.find(x=>x.id===id),per=sumBy(m.items);return{name:m.name,phone:us?us.phone:'',n:m.items.length,total:r2(m.items.reduce((t,r)=>t+r.amount,0)),per}}).sort((a,b)=>a.name<b.name?-1:1);
   dl('giving-statements-'+Y+'.csv',[line(['Member','Phone','Receipts','Total (KSh)',...cats]),...people.map(p=>line([p.name,p.phone,p.n,p.total,...cats.map(c=>p.per[c]||0)])),line(['TOTAL','',rc.length,r2(rc.reduce((t,r)=>t+r.amount,0)),...cats.map(c=>r2(people.reduce((t,p)=>t+(p.per[c]||0),0)))])].join('\r\n')+'\r\n');audit(me().name,'export','receipts',Y,'all statements ('+people.length+')')},
 rollSave(id){const u=me(),m=S.memberships.find(x=>x.id===id);if(!canRoll(u)||!m)return;const to=$('rs_'+id).value,dest=$('rd_'+id).value.trim(),note=$('rn_'+id).value.trim();
   if(to==='transferred_out'&&!dest){toast('Write the church they are moving to.');return}
   const h=[...(m.history||[]),{from:m.status,to,date:nowDay(),by:u.name,note,dest}];upd('memberships',id,{status:to,statusDate:nowDay(),statusNote:note,statusDest:to==='transferred_out'?dest:'',history:h});audit(u.name,'update','memberships',id,'roll: '+m.status+' -> '+to);save();render();toast('Status saved')},
 letter(id,type){const u=me(),m=S.memberships.find(x=>x.id===id);if(!canLetter(u)||!m)return;let dest='';
   if(type==='transfer'){const e=$('ld_'+id);dest=((e&&e.value)||m.statusDest||'').trim();if(!dest){toast('Write the church they are moving to.');return}}
   S.counters.letter++;const today=nowDay(),ref='LTR-'+today.slice(0,4)+'-'+String(S.counters.letter).padStart(4,'0');
   const text=LETTER[LANG==='sw'?'sw':'en'][type]({church:curChurch().name,name:m.name,memberNo:m.memberNo||'',baptismDate:m.date||'',destination:dest,ref,today}).join('\n').replace(/\n{3,}/g,'\n\n');
   audit(u.name,'letter','memberships',id,type+' '+ref);RO.letter={ref,text};save();render();window.scrollTo(0,0)},

});
