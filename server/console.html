<style>
/* Seventh-day Adventist Church emblem in every console header */
header h1::before,.sdalogo{content:'';display:inline-block;width:28px;height:28px;border-radius:50%;background:#fff url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAGx0lEQVR42u2YaYxV5RnHf//33GUupYzVggu0iM7IiIBRklptzAgjLQKCVoc6uERplRhjuqRJEzQSY9K0iR80TVpxqQtaxjsFQdBG6DiMGmtMqVYoMmUr1nVMo6jA3Dv3vP9+GGJhRFnUC6Q8n8/7nP/vfc6zHThi/ydWaq0//cvwG6pGYF952AJsm183DOnwBPD9w2uSjNps/n3YAbg4Klcu5B6V+LYVHjysADxvXLYcy63ANPCrwodPBNzRmCkP+mAB6GKbHQTNFJ55WAC4SFJ6580HEZcYInBFjPFrtid8GQCZL1x8WjdfosUQhWbH6JcVwguCvx7SEfBcQinW3y+pxcZBviGtlFeExO0Sg23fe8gC2Kh0at3vBFfapApcU4l+Islk20EnghcphKMOSQDPJZRa6+8Vuq5PvK+ulN2eKHQAJ2M25NIw28TZhxyAjUoNdXdJzDJEiVmVNHk6k9XTwMlAd0ziBaUQfyj0jX49YuBBByi31s+VdK2Ng7m+HCtPZRRXAPU27xI1UWkYi/RL4IXdDvdk3LOg7i4XT6o9KACl1rpmwy2GqOAflXrTxdmQaUeMArqVhCYrHQFegFEk3rnreV31yjakLeWY/KzqANv+MPIEW/cABHN9TizNZpN2wWlAN6RNjumJoKKkHPI9hcs2dvT3IygYzvdDY79SVYBMSOdI1AK/yCZ+rJTSLjEa87ZTNTomwzF/lJQDVuZD7sZPyaHJQKGc23Gh59cNqgqA543L2rocszBfU76nlLJC0hjgHSducpIOJ/SJt/1criZM04y15f5+elrrJ0uMk9mEyJezmlyVTlyufX8MDrmcKzeUS7mixOlANzE22RomhcWCGuNn84Vkii7q+rC/j4+Kw49Tyn0IgGWYBpv/VCUCMTIEeKBHmWZgos27hHB+lIZKWiKoAT+dH7Bt0p7EuzhqYCbNLUIcB2zMFcJC8Azh96oSgSSE7TG4Q6l+a7wtJL4gjRwr1Hfz9nP5JDdd0zZs39NyU47lJZLOttkepJZST7xO6CQlydqqRKAUK12OOl5isGB2WklqZR6XKNh+Jt87YJJmrP1oTx27XMg9Cppg6LGYTrAwt9l+Oa3EM6sC8NWZm9+ROcP2M5UsnVIs7hT/XD7JTdFVr2zbY+401N0KTDPuBc8IMb7l2AcOui0ET6vaOC35m466I+lljsQx2F35QjJZF33y5gHKxfpvxZSbsCugyyRes9QhGAx+LCR63alPq+Y+8EHsTVeFXPJ7Q0lJ0rynhP3484nM6QPnaqI3G9olHWOzJt/TO6tcyC4EralaI5NY7mxyvMRRQFt+Rtfqz24enAWeG80LBP1J0jHA+tThe6Wa7I2gCQQWVg0g+37tfcrGBCAke19UjN9OXbovSE8Bx4I3VXo9IZOkk0C3Yl7LbS/Pr14EZq/qLXx92Is2WyvEzXt9SWBeJuQf2rkfvJZWKhMy2TDJUXcjHPG1umZLT1WnUY3vrIDnJmnm7L13P0VQE/YbMYlNIZO91PbdEgn2nELLhuUHZR+oadlwp6yNnjcu+9n6fYXhPaOJSjVFcLuEjB+oadnw68+jQV/oftfcOBCGlGlr221461lQ96HlS4M02FEPScimmE/Wz9QM0moDiClNI0jiaOzR4LFYo4ARiIF9OetN4J+y7JmlO5efRaBbbf4iUcBevH5d7gejVw2+AVGDwj9wZTVLn/0X4C8O4OKJQ+jtHUNgNGY09hjQaTuF7q30vMWylScA9BTrL1b0r0CnYD/58+ePbvnN5sL9SN/vd+ZD8Fqk1Yg1RNaQza7msRXd+w :root{--bg:#F6F4EE;--card:#fff;--ink:#1F2A37;--mute:#6B7280;--line:#E5E1D6;--pri:#1F4E79;--soft:#E3EDF7;--gold:#B8862B;--ok:#2E7D4F;--warn:#B45309;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:200px}
header small{opacity:.85}
.demo{background:var(--gold);color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.04em}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--soft);color:var(--pri)}
nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}
main{max-width:1040px;margin:0 auto;padding:16px}
h2{font-size:19px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button.b{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
button.b.g{background:#fff;color:var(--pri);border:1px solid var(--pri)}
button.b.d{background:#fff;color:var(--bad);border:1px solid var(--bad)}
button.b.ok{background:var(--ok)}
button.b:disabled{opacity:.5;cursor:default}
button.b.s{padding:5px 10px;font-size:13px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.active{background:#E4F3EA;color:var(--ok)}.pill.suspended{background:#FDF0DC;color:var(--warn)}.pill.archived{background:#EEE;color:#555}.pill.quiet{background:#FDF0DC;color:var(--warn)}.pill.dormant,.pill.setup{background:#FBE3E1;color:var(--bad)}.pill.paused{background:#EEE;color:#555}
.num{font:700 17px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--pri)}
.mute{color:var(--mute)}.err{color:var(--bad);font-weight:600;margin:8px 0}.okmsg{color:var(--ok);font-weight:600;margin:8px 0}
.big{font-size:30px;font-weight:800;color:var(--pri)}
.chat{height:340px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 11px;border-radius:12px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--soft);border-color:#C9DCEE}
.msg small{display:block;color:var(--mute);font-size:11px;margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2.sup{grid-template-columns:minmax(220px,1fr) 2fr}.card{overflow-x:auto}
@media(max-width:760px){.grid2,.grid2.sup{grid-template-columns:1fr}.row>*{min-width:140px}th.h,td.h{display:none}}
.login{max-width:380px;margin:40px auto}
.back{background:none;border:0;color:var(--pri);font-weight:700;cursor:pointer;padding:0;margin-bottom:8px;font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ------------------------------------------------------------------ helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' }); };
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* private mode */ } }, del: (k) => { try { sessionStorage.removeItem(k); } catch { /* ignore */ } } };

// Demo mode: when this page is opened as a plain file (no server behind it) it runs against a small in-browser copy of the API,
// so you can click through every screen. On the real server (/console) it always talks to the real API.
const DEMO = location.protocol === 'file:' || new URLSearchParams(location.search).has('demo');

// ------------------------------------------------------------------ API
let token = store.get('dev-token');
async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { token = null; store.del('dev-token'); state.dev = null; render(); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Something went wrong.'), { status: r.status });
  return j;
}

// ------------------------------------------------------------------ state + render
const state = { dev: null, view: 'churches', month: '', churchId: null, churches: [], team: null, unread: 0, threads: [], filter: '', msg: '', err: '', login: { step: 'phone', phone: '' } };
const setMsg = (m, e) => { state.msg = m || ''; state.err = e || ''; };
const flash = () => (state.err ? `<div class="err">${esc(state.err)}</div>` : '') + (state.msg ? `<div class="okmsg">${esc(state.msg)}</div>` : '');
const app = $('#app');
let chatTimer = null;

function render() {
  clearInterval(chatTimer); chatTimer = null;
  if (!state.dev) return renderLogin();
  app.innerHTML = `
  <header><h1>Church Connect · Developer Console ${DEMO ? '<span class="demo">DEMO</span>' : ''}</h1><small>${esc(state.dev.name)}</small><button class="b g s" id="out">Sign out</button></header>
  <nav>${[['churches', 'Churches'], ['new', 'New church'], ['support', 'Support'], ['reports', 'Reports'], ['team', 'Team'], ['template', 'Template'], ['activity', 'Activity']].map(([k, l]) => `<button data-v="${k}" class="${state.view === k || (k === 'churches' && state.view === 'church') ? 'on' : ''}">${l}${k === 'support' && state.unread ? `<span class="badge">${state.unread}</span>` : ''}${k === 'team' && state.team ? ` (${state.team.active}/${state.team.limit})` : ''}</button>`).join('')}</nav>
  <main id="main"></main>`;
  $('#out').onclick = () => { token = null; store.del('dev-token'); state.dev = null; render(); };
  app.querySelectorAll('nav button').forEach((b) => (b.onclick = () => go(b.dataset.v)));
  views[state.view]();
}
function go(v, churchId) { state.view = v; if (churchId) state.churchId = churchId; setMsg(); render(); }

// ------------------------------------------------------------------ sign in
// Team quick entry: only a sandbox server (made-up data) offers it. One tap, no SMS code.
async function loadQuick() {
  let list; try { list = (await api('GET', '/sandbox/numbers')).numbers; } catch { return; }
  const dev = list.filter((n) => n.console === 'developer');
  const box = document.createElement('div'); box.className = 'card'; box.style.cssText = 'background:#FFF7E0;margin-top:12px';
  box.innerHTML = `<b>Team quick entry (test server)</b><p class="mute">For the developer and development team. This server holds made-up data, so these numbers open the console with one tap and no code.</p>` +
    dev.map((n) => `<button class="b g" data-q="${n.phone}" style="margin:3px 3px 0 0">${esc(n.label.replace('App Developer console, ', ''))} · ${n.phone}</button>`).join('') +
    `<p class="mute" style="margin-top:10px">Church Admin and every leader dashboard: open the phone app on this server and use its Team quick entry list (numbers 0700000101 and 0700000201 to 0700000221).</p>`;
  const card = app.querySelector('.login'); if (!card) return; card.appendChild(box);
  box.querySelectorAll('[data-q]').forEach((b) => b.onclick = async () => {
    try { const r = await api('POST', '/sandbox/enter', { phone: b.dataset.q }); token = r.token; store.set('dev-token', token); state.dev = r.developer; setMsg(); await boot(); }
    catch (e) { setMsg('', e.message); renderLogin(); }
  });
}
function renderLogin() {
  const L = state.login;
  app.innerHTML = `<div class="login card"><div style="text-align:center;margin-bottom:6px"><span class="sdalogo" style="width:64px;height:64px;border:1px solid var(--line);vertical-align:middle" role="img" aria-label="Seventh-day Adventist Church"></span></div><h2 style="text-align:center">Developer sign in</h2>
    <p class="mute">Only phone numbers on the app developer team can open this console. ${DEMO ? 'Demo: use <b>0700000001</b>; the code is shown on screen.' : ''}</p>${flash()}
    ${L.step === 'phone' ? `<label>Phone number</label><input id="ph" inputmode="tel" placeholder="07XXXXXXXX" value="${esc(L.phone)}"><p><button class="b" id="go">Send code</button></p>`
      : `<label>SMS code sent to ${esc(L.phone)}</label><input id="cd" inputmode="numeric" maxlength="6" placeholder="6-digit code" value="${esc(L.dev || '')}"><p><button class="b" id="go">Sign in</button> <button class="b g" id="bk">Change number</button></p>`}</div>`;
  if (L.step === 'phone') loadQuick();
  if (L.step === 'phone') {
    $('#go').onclick = async () => {
      L.phone = $('#ph').value.trim(); setMsg();
      try { const r = await api('POST', '/auth/request-otp', { phone: L.phone }); L.dev = r.devCode || ''; L.step = 'code'; } catch (e) { setMsg('', e.message); }
      renderLogin();
    };
  } else {
    $('#bk').onclick = () => { L.step = 'phone'; setMsg(); renderLogin(); };
    $('#go').onclick = async () => {
      try { const r = await api('POST', '/dev/login', { phone: L.phone, code: $('#cd').value.trim() }); token = r.token; store.set('dev-token', token); state.dev = r.developer; setMsg(); await boot(); }
      catch (e) { setMsg('', e.message); renderLogin(); }
    };
  }
}

async function boot() {
  try { await Promise.all([loadChurches(), loadTeam(), loadThreads()]); } catch (e) { setMsg('', e.message); }
  render();
}
const loadChurches = async () => { state.churches = (await api('GET', '/dev/churches')).churches; };
const loadTeam = async () => { state.team = await api('GET', '/dev/team'); };
const loadThreads = async () => { const r = await api('GET', '/dev/support'); state.threads = r.threads; state.unread = r.unread; };

// ------------------------------------------------------------------ views
const views = {
  churches() {
    const q = state.filter.toLowerCase();
    const rows = state.churches.filter((c) => !q || (c.name + ' ' + c.number + ' ' + c.district + ' ' + c.county).toLowerCase().includes(q));
    const tot = state.churches.reduce((s, c) => s + c.members, 0);
    $('#main').innerHTML = `<h2>Churches</h2>${flash()}
    <div class="row" style="margin-bottom:12px"><div class="card"><div class="big">${state.churches.length}</div><div class="mute">churches</div></div><div class="card"><div class="big">${state.churches.filter((c) => c.status === 'active').length}</div><div class="mute">active</div></div><div class="card"><div class="big">${tot}</div><div class="mute">members in total</div></div><div class="card"><div class="big">${state.unread}</div><div class="mute">unread support messages</div></div></div>
    <div class="card"><div class="row"><input id="f" placeholder="Search by church name, number, district…" value="${esc(state.filter)}"><div style="flex:0"><button class="b" id="nw">+ New church</button></div></div>
    <table><tr><th>Church</th><th>Number</th><th class="h">Members</th><th class="h">Waiting</th><th>Status</th><th></th></tr>

    let num = String(body.number || '').replace(/\D/g, '');
    if (num) { if (!validNum(num)) fail(400, 'That church number is not valid. It must be 7 digits ending in the correct check digit.'); if (s.churches.some((c) => c.number === num)) fail(409, 'That church number is already assigned to another church.'); }
    else do { const six = String(100000 + Math.floor(Math.random() * 900000)); num = six + luhn(six); } while (s.churches.some((c) => c.number === num));
    const src = s.churches.find((c) => c.id === body.cloneFrom);
    const c = { id: 'c' + Date.now(), number: num, name: nm, status: 'active', adminPhone: body.adminPhone || '', district: body.district || '', station: body.station || '', conference: body.conference || '', county: body.county || '', note: body.note || '', members: 0, waiting: 0, createdAt: new Date().toISOString(), clonedFrom: src ? src.id : null, settings: { ...(src ? src.settings : s.template) } };
    s.churches.push(c); log('church.create', nm + ' #' + num); save(); return { church: row(c) };
  }
  if ((m = p.match(/^\/dev\/churches\/([^/]+)$/)) && method === 'GET') { const c = s.churches.find((x) => x.id === m[1]); if (!c) fail(404, 'Church not found.'); return { church: row(c), settings: c.settings, bindings: c.members, history: s.audit.filter((a) => (a.detail || '').includes(c.name)).slice(0, 30) }; }
  if ((m = p.match(/^\/dev\/churches\/([^/]+)\/(update|admin|status)$/))) {
    const c = s.churches.find((x) => x.id === m[1]); if (!c) fail(404, 'Church not found.');
    if (m[2] === 'update') { if (body.name !== undefined) { if (body.name.trim().length < 3) fail(400, 'Write the church name (at least 3 letters).'); c.name = body.name.trim(); } for (const k of ['district', 'station', 'conference', 'county', 'note']) if (typeof body[k] === 'string') c[k] = body[k]; if (body.settings) c.settings = { ...c.settings, ...body.settings }; log('church.update', c.name); }
    if (m[2] === 'admin') { if (!/^0\d{9}$/.test(body.phone || '')) fail(400, 'Enter a valid Kenyan phone number for the church admin.'); if (body.phone === c.adminPhone) fail(409, 'That person is already the admin.'); c.adminPhone = body.phone; log('church.admin', c.name + ' ' + body.phone); }
    if (m[2] === 'status') { c.status = body.status; log('church.' + body.status, c.name); }
    save(); return { church: row(c) };
  }
  if (p === '/dev/reports/health') {
    const month = new URLSearchParams(qs || '').get('month') || new Date().toISOString().slice(0, 7);
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) fail(400, 'Choose a month like 2026-10.');
    const cur = month === new Date().toISOString().slice(0, 7);
    const rows = s.churches.map((c, i) => { const adminIn = i < 2; const health = c.status === 'archived' ? 'archived' : c.status === 'suspended' ? 'paused' : !adminIn ? 'setup' : 'active'; const k = cur ? 1 : 0; const sp = { messagesFromChurch: s.msgs.filter((x) => x.churchId === c.id && x.from === 'admin').length * k, messagesFromDevelopers: s.msgs.filter((x) => x.churchId === c.id && x.from === 'developer').length * k, unread: unread(c.id) };
      const attention = []; if (health === 'setup') attention.push('The church admin has not signed in yet.'); if (c.waiting >= 5) attention.push(c.waiting + ' people are waiting to join.'); if (sp.unread) attention.push(sp.unread + ' unread support message' + (sp.unread > 1 ? 's' : '') + '.');
      return { id: c.id, number: fmtNum(c.number), name: c.name, status: c.status, health, lastActivity: c.createdAt, members: c.members, waiting: c.waiting, newMembers: cur ? Math.round(c.members / 10) : 0, payments: cur ? c.members : 0, receipts: cur ? Math.round(c.members * 0.8) : 0, notices: cur ? 4 : 0, activities: cur ? 3 : 0, sermons: cur ? 2 : 0, attendance: cur ? 4 : 0, withPush: Math.round(c.members * 0.6), support: sp, attention }; });
    const sum = (f) => rows.reduce((t, r) => t + f(r), 0); const cnt = (h) => rows.filter((r) => r.health === h).length;
    const totals = { churches: rows.length, active: cnt('active'), quiet: cnt('quiet'), dormant: cnt('dormant'), setup: cnt('setup'), paused: cnt('paused'), archived: cnt('archived'), members: sum((r) => r.members), waiting: sum((r) => r.waiting), newMembers: sum((r) => r.newMembers), receipts: sum((r) => r.receipts), notices: sum((r) => r.notices), sermons: sum((r) => r.sermons), supportUnread: sum((r) => r.support.unread) };
    const cell = (v) => { const t = String(v ?? ''); return /[",\n\r;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const csv = '﻿' + [['Church', 'Church number', 'Status', 'Health', 'Members', 'Waiting', 'New members', 'Payments reported', 'Receipts issued', 'Notices', 'Activities', 'Sermon summaries', 'Attendance records', 'Phones with alerts', 'Last activity', 'Support: from church', 'Support: from us'], ...rows.map((r) => [r.name, r.number, r.status, r.health, r.members, r.waiting, r.newMembers, r.payments, r.receipts, r.notices, r.activities, r.sermons, r.attendance, r.withPush, (r.lastActivity || '').slice(0, 10), r.support.messagesFromChurch, r.support.messagesFromDevelopers])].map((l) => l.map(cell).join(',')).join('\r\n') + '\r\n';
    return { month, totals, churches: rows, needAttention: rows.filter((r) => r.attention.length && r.status !== 'archived').map((r) => ({ id: r.id, name: r.name, number: r.number, reasons: r.attention })), csv };
  }
  if (p === '/dev/audit') return { entries: s.audit.slice(0, 200) };
  if (p === '/dev/support' && method === 'GET') { const th = s.churches.map((c) => { const ms = s.msgs.filter((x) => x.churchId === c.id); const l = ms[ms.length - 1]; return l ? { churchId: c.id, church: c.name, number: fmtNum(c.number), unread: unread(c.id), last: l } : null; }).filter(Boolean).sort((a, b) => (b.last.at > a.last.at ? 1 : -1)); return { threads: th, unread: th.reduce((n, t) => n + t.unread, 0) }; }
  if ((m = p.match(/^\/dev\/support\/([^/]+)$/))) {
    if (method === 'GET') { const ms = s.msgs.filter((x) => x.churchId === m[1] && x.at > after); s.reads[me().id + m[1]] = new Date().toISOString(); save(); return { messages: ms }; }
    const t = String(body.body || '').trim(); if (!t) fail(400, 'Write a message first.');
    s.msgs.push({ id: 'm' + Date.now(), churchId: m[1], from: 'developer', name: me().name, body: t, at: new Date().toISOString() }); save(); return {};
  }
  fail(404, 'Not found (demo).');
}

// ------------------------------------------------------------------ start
(async () => {
  if (token || DEMO) {
    try { if (!DEMO) state.dev = (await api('GET', '/dev/me')).developer; } catch { token = null; store.del('dev-token'); }
    if (state.dev) boot(); else render();
  } else render();
  setInterval(async () => { if (state.dev && !document.hidden) { const before = state.unread; try { await loadThreads(); } catch { return; } if (state.unread !== before && state.view !== 'support') render(); } }, 20000);
})();
</script>
